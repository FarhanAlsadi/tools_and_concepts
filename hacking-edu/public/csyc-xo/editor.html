<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage XO Questions</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
  <style>
    body { color: #fff; font-family: 'Orbitron', sans-serif; }
    .wrap { max-width: 1000px; margin: 30px auto; padding: 0 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h1 { margin: 0; font-size: 22px; }
    .back { color: #00cccc; text-decoration: none; font-size: 14px; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    select, input[type="text"], textarea {
      background: #0e1f39; color: #fff; border: 1px solid #00cccc;
      border-radius: 4px; padding: 8px 10px; font-family: inherit; font-size: 14px;
    }
    select { min-width: 180px; }
    .btn {
      background: #00cccc; color: #0e1f39; border: none; border-radius: 4px;
      padding: 8px 16px; cursor: pointer; font-family: inherit; font-weight: 700;
    }
    .btn:hover { background: #33e0e0; }
    .btn.danger { background: #ff4444; color: #fff; }
    .btn.ghost { background: transparent; color: #00cccc; border: 1px solid #00cccc; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; background: rgba(14,31,57,0.6); }
    th, td { padding: 10px; border-bottom: 1px solid #2a3f60; vertical-align: top; text-align: left; font-size: 14px; }
    th { background: #0e1f39; color: #00cccc; }
    td .actions { display: flex; gap: 6px; }
    .empty { padding: 30px; text-align: center; color: #aaa; }
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: #0e1f39; border: 1px solid #00cccc; border-radius: 8px;
      padding: 24px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { margin-top: 0; }
    .modal label { display: block; margin-top: 12px; font-size: 14px; color: #00cccc; }
    .modal input[type="text"], .modal textarea, .modal select { width: 100%; box-sizing: border-box; margin-top: 4px; }
    .modal textarea { min-height: 60px; resize: vertical; }
    .option-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .option-row input[type="text"] { flex: 1; }
    .option-row input[type="radio"] { transform: scale(1.3); }
    .modal-actions { margin-top: 18px; display: flex; gap: 10px; justify-content: flex-end; }
    .toast {
      position: fixed; top: 20px; right: 20px;
      padding: 10px 16px; border-radius: 4px; color: #fff; font-size: 14px;
      z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.s { background: #0a8a0a; }
    .toast.e { background: #c02222; }
    .toast.i { background: #0e1f39; border: 1px solid #00cccc; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>Manage XO Questions</h1>
    <a href="index.html" class="back">&larr; Back to game</a>
  </div>

  <div class="controls">
    <label>Subject:
      <select id="subject-select">
        <option value="">Loading...</option>
      </select>
    </label>
    <button class="btn ghost" id="new-subject-btn" type="button">+ New subject</button>
    <button class="btn" id="add-btn" type="button">+ Add question</button>
    <span id="count" style="color:#aaa; font-size:14px;"></span>
  </div>

  <div id="table-container"></div>
</div>

<!-- Edit/Add modal -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add Question</h2>
    <input type="hidden" id="edit-id">

    <label>Subject
      <select id="m-subject"></select>
    </label>

    <label>Question
      <textarea id="m-question" placeholder="Enter the question text"></textarea>
    </label>

    <label>Options (pick the correct one)</label>
    <div id="option-rows"></div>

    <label>Legacy concept (optional tag)
      <input type="text" id="m-concept" placeholder="e.g. linux_attack_methodology">
    </label>

    <div class="modal-actions">
      <button class="btn ghost" id="cancel-btn" type="button">Cancel</button>
      <button class="btn" id="save-btn" type="button">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const modal = $('modal');
let questions = [];
let subjects = [];
let currentSubject = '';

function toast(msg, type = 'i') {
  const t = $('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className = `toast ${type}`, 2500);
}

async function loadSubjects() {
  const r = await fetch('/api/xo/subjects');
  const data = await r.json();
  subjects = data.subjects || [];
  const sel = $('subject-select');
  sel.innerHTML = '';
  if (subjects.length === 0) {
    sel.innerHTML = '<option value="">(no subjects)</option>';
    currentSubject = '';
  } else {
    subjects.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s.replaceAll('_', ' ');
      sel.appendChild(opt);
    });
    if (!currentSubject || !subjects.includes(currentSubject)) {
      currentSubject = subjects[0];
    }
    sel.value = currentSubject;
  }
}

async function loadQuestions() {
  const container = $('table-container');
  if (!currentSubject) {
    container.innerHTML = '<div class="empty">Pick or add a subject, then add questions.</div>';
    $('count').textContent = '';
    return;
  }
  container.innerHTML = '<div class="empty">Loading...</div>';
  const r = await fetch(`/api/xo/questions?subject=${encodeURIComponent(currentSubject)}`);
  const data = await r.json();
  questions = data.questions || [];
  $('count').textContent = `${questions.length} question${questions.length === 1 ? '' : 's'}`;
  if (questions.length === 0) {
    container.innerHTML = '<div class="empty">No questions yet. Click "+ Add question".</div>';
    return;
  }
  const rows = questions.map(q => `
    <tr>
      <td>${escapeHtml(q.question)}</td>
      <td>${escapeHtml(q.answer)}</td>
      <td><div class="actions">
        <button class="btn ghost" onclick="openEdit(${q.id})">Edit</button>
        <button class="btn danger" onclick="doDelete(${q.id})">Delete</button>
      </div></td>
    </tr>`).join('');
  container.innerHTML = `
    <table>
      <thead><tr><th>Question</th><th>Answer</th><th style="width:160px">Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function renderOptionRows(opts = ['', '', '', ''], correctIdx = 0) {
  const host = $('option-rows');
  host.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const row = document.createElement('div');
    row.className = 'option-row';
    row.innerHTML = `
      <input type="radio" name="correct" value="${i}" ${i === correctIdx ? 'checked' : ''}>
      <input type="text" id="opt-${i}" value="${escapeHtml(opts[i] || '')}" placeholder="Option ${i+1}">
    `;
    host.appendChild(row);
  }
}

function populateSubjectSelect(selEl, selected) {
  selEl.innerHTML = '';
  subjects.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s.replaceAll('_', ' ');
    if (s === selected) opt.selected = true;
    selEl.appendChild(opt);
  });
  if (subjects.length === 0) {
    const opt = document.createElement('option');
    opt.value = ''; opt.textContent = '(no subjects — add one first)';
    selEl.appendChild(opt);
  }
}

function openAdd() {
  $('modal-title').textContent = 'Add Question';
  $('edit-id').value = '';
  populateSubjectSelect($('m-subject'), currentSubject);
  $('m-question').value = '';
  $('m-concept').value = '';
  renderOptionRows();
  modal.classList.add('show');
}

window.openEdit = function(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  $('modal-title').textContent = 'Edit Question';
  $('edit-id').value = q.id;
  populateSubjectSelect($('m-subject'), q.subject);
  $('m-question').value = q.question;
  $('m-concept').value = q.legacy_concept || '';
  const correctIdx = (q.options || []).findIndex(o => o === q.answer);
  renderOptionRows(q.options || ['', '', '', ''], correctIdx >= 0 ? correctIdx : 0);
  modal.classList.add('show');
};

window.doDelete = async function(id) {
  if (!confirm('Delete this question?')) return;
  try {
    const r = await fetch(`/api/xo/questions/${id}`, { method: 'DELETE' });
    if (!r.ok) throw new Error(await r.text());
    toast('Deleted', 's');
    await loadQuestions();
  } catch (e) { toast('Delete failed: ' + e.message, 'e'); }
};

async function save() {
  const id = $('edit-id').value;
  const subject = $('m-subject').value.trim();
  const question = $('m-question').value.trim();
  const opts = [0,1,2,3].map(i => $(`opt-${i}`).value.trim());
  const correctIdx = parseInt((document.querySelector('input[name="correct"]:checked') || {}).value, 10);
  const concept = $('m-concept').value.trim();

  if (!subject) return toast('Pick a subject', 'e');
  if (!question) return toast('Question is required', 'e');
  if (opts.some(o => !o)) return toast('All 4 options must be filled', 'e');
  if (isNaN(correctIdx)) return toast('Mark the correct option', 'e');

  const body = {
    subject,
    question,
    options: opts,
    answer: opts[correctIdx],
    legacy_concept: concept || null,
  };

  try {
    const r = await fetch(id ? `/api/xo/questions/${id}` : '/api/xo/questions', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || r.statusText);
    }
    toast(id ? 'Updated' : 'Added', 's');
    modal.classList.remove('show');
    currentSubject = subject;
    await loadSubjects();
    await loadQuestions();
  } catch (e) { toast('Save failed: ' + e.message, 'e'); }
}

$('subject-select').addEventListener('change', (e) => {
  currentSubject = e.target.value;
  loadQuestions();
});
$('add-btn').addEventListener('click', openAdd);
$('cancel-btn').addEventListener('click', () => modal.classList.remove('show'));
$('save-btn').addEventListener('click', save);
$('new-subject-btn').addEventListener('click', () => {
  const name = prompt('New subject name (use underscores for spaces, e.g. "Web_Dev_101"):');
  if (!name) return;
  const clean = name.trim().replace(/\s+/g, '_');
  if (!clean) return;
  if (!subjects.includes(clean)) {
    subjects.push(clean);
    subjects.sort();
  }
  currentSubject = clean;
  // Refresh dropdown and open Add modal pre-selected
  const sel = $('subject-select');
  if (![...sel.options].some(o => o.value === clean)) {
    const opt = document.createElement('option');
    opt.value = clean; opt.textContent = clean.replaceAll('_', ' ');
    sel.appendChild(opt);
  }
  sel.value = clean;
  loadQuestions();
  toast(`Subject "${clean}" ready. Add a question to save it.`, 'i');
});
modal.addEventListener('click', (e) => {
  if (e.target === modal) modal.classList.remove('show');
});

(async () => {
  await loadSubjects();
  await loadQuestions();
})();
</script>
</body>
</html>
