services:
  - type: web
    name: hacking-lessons
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --threads 8
    envVars:
      - key: FLASK_ENV
        value: production
      - key: TRAINER_PIN
        sync: false
